# Gradle 9 itself needs a modern JVM; the mod is still compiled to Java 8 via the
# toolchain in build.gradle. Bump memory because deobfuscating Minecraft is heavy.
org.gradle.jvmargs = -Xmx3G
org.gradle.daemon = true
org.gradle.parallel = true

mod_id          = mtmixins
mod_name        = Medieval Times Mixins
mod_version     = 0.2.0
mod_group       = com.novotimo.mtmixins
mod_description = Mixin patches for the Medieval Times: Empires Rising modpack.
mod_authors     = novotimo

# https://maven.cleanroommc.com/zone/rong/mixinbooter/
mixinbooter_version = 11.17
